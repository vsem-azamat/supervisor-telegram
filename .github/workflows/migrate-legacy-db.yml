# One-off: carry the production rows onto the database this stack now owns.
#
# The db service is new, so the first deploy starts an empty database beside the
# old server. This runs the import on the VPS, which is the only place that can
# reach the new database — it is not published outside the compose network.
#
# Delete this workflow and the LEGACY_DB_URL secret once the data is across.
# See docs/deployment/database-handover.md.
name: Migrate legacy database

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the rows. Leave off for a plan that changes nothing."
        type: boolean
        default: false

concurrency:
  group: migrate-legacy-db

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Import on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          LEGACY_DB_URL: ${{ secrets.LEGACY_DB_URL }}
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LEGACY_DB_URL,APPLY
          script: |
            set -e
            cd ~/deploy/supervisor-telegram

            if [ -z "$LEGACY_DB_URL" ]; then
              echo "LEGACY_DB_URL is not set; nothing to import from." >&2
              exit 1
            fi

            # The DSN travels in the environment rather than on the command
            # line, where the host's process list would show it.
            if [ "$APPLY" = "true" ]; then
              docker compose exec -T -e LEGACY_DB_URL bot \
                /app/.venv/bin/python scripts/import_legacy_db.py --apply
            else
              docker compose exec -T -e LEGACY_DB_URL bot \
                /app/.venv/bin/python scripts/import_legacy_db.py
            fi

            echo "--- what the bot's database holds now ---"
            docker compose exec -T db psql -U konnekt -d konnekt -tAc "
              SELECT 'chats      ' || count(*) FROM chats
              UNION ALL SELECT 'users      ' || count(*) FROM users
              UNION ALL SELECT 'blacklisted' || count(*) FROM users WHERE blocked
              UNION ALL SELECT 'messages   ' || count(*) FROM messages
              UNION ALL SELECT 'chat_links ' || count(*) FROM chat_links;"
