name: Tests

on:
  workflow_call:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_moderator_bot
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: test_moderator_bot
      DB_HOST: localhost
      DB_PORT: 5432
      MODERATOR_BOT_TOKEN: "test_token"
      ADMIN_SUPER_ADMINS: "123456789"

    # Matrix kept (even though single-versioned) so the required-status-check
    # rule `test (3.12)` keeps matching.
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.11.11"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint + format check (ruff)
      run: |
        uv run ruff check app tests scripts
        uv run ruff format --check app tests scripts

    - name: Type check (ty)
      run: uv run ty check app tests

    # Single pytest invocation covering all suites with coverage. Pytest
    # auto-discovers from testpaths=["tests"] (unit + integration + e2e +
    # handlers + middleware + performance). Previously each suite ran
    # separately AND the full run was repeated with --cov, duplicating
    # ~1.5 min of work.
    - name: Pytest with coverage
      run: uv run pytest --cov=app --cov-report=xml --cov-report=html --cov-fail-under=55

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6.0.0
      if: success()
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage reports as artifact
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: coverage-reports
        path: htmlcov/

    - name: Set up Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: "24.15.0"

    - name: Set up pnpm
      run: |
        corepack enable
        corepack prepare pnpm@10.33.0 --activate

    - name: Install webui dependencies
      run: pnpm --dir webui install --frozen-lockfile

    - name: Check webui
      run: pnpm --dir webui run check

    - name: Build webui
      run: pnpm --dir webui run build

    # The Mini App. Its own working directory, so corepack picks the pnpm its
    # package.json names (11) rather than the webui's 10 activated above.
    - name: Install web dependencies
      working-directory: web
      run: pnpm install --frozen-lockfile

    - name: Lint web
      working-directory: web
      run: pnpm lint

    - name: Type check web
      working-directory: web
      run: pnpm typecheck

    - name: Test web
      working-directory: web
      run: pnpm test

    # A message used in code but missing from a catalog renders as its Russian
    # source in the other three languages, silently. compile reads only the
    # catalogs, so extract first and fail when that changes them. Never
    # --clean: it drops the obsolete entries the catalogs keep on purpose.
    - name: Every web message is translated
      working-directory: web
      run: |
        pnpm exec lingui extract
        changed=$(git status --porcelain -- src/locales)
        if [ -n "$changed" ]; then
          echo "$changed"
          echo "Run \`pnpm i18n:extract\` in web/, translate, and commit." >&2
          exit 1
        fi
        pnpm exec lingui compile --strict

    # The client in web/src/lib/generated is generated from the catalog API's
    # document, committed beside it as catalog-openapi.json. Regenerating must
    # change nothing; `catalog-contract.yml` checks the document against the
    # catalog itself.
    - name: The web client matches the catalog API's contract
      working-directory: web
      run: |
        pnpm api:generate
        changed=$(git status --porcelain -- src/lib/generated)
        if [ -n "$changed" ]; then
          echo "$changed"
          echo "Run \`pnpm api:generate\` in web/ and commit src/lib/generated." >&2
          exit 1
        fi

    - name: Build web
      working-directory: web
      run: pnpm build

    - name: Each path goes to the backend or build that owns it
      run: |
        set -euo pipefail
        docker run --rm -e CATALOG_ORIGIN=https://catalog.invalid \
          -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
          caddy:2.11.2-alpine caddy adapt --config /etc/caddy/Caddyfile \
          | python3 docker/check-routes.py catalog.invalid
